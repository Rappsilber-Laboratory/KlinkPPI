# KlinkPPI behind the university web server (HTTPS on the standard port 443).
# Replace klinkppi.example.org and the certificate paths with the real values.

server {
    listen 80;
    server_name klinkppi.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name klinkppi.example.org;

    ssl_certificate     /etc/ssl/certs/klinkppi.example.org.pem;
    ssl_certificate_key /etc/ssl/private/klinkppi.example.org.key;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # No access logs with query strings: submitted identifiers stay private.
    access_log off;
    client_max_body_size 2m;

    # app.server serves the web app at / and the API at /api.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # single searches can query 12 sources
    }
}
